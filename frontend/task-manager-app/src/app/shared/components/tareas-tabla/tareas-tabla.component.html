<div class="tareas-tabla-buscador">
  <div class="tareas-tabla-buscador__caja">
    <mat-icon class="tareas-tabla-buscador__icono" inline>search</mat-icon>
    <input
      type="search"
      class="tareas-tabla-buscador__input"
      placeholder="Buscar por tarea, proyecto, asignado o creador…"
      (input)="onBuscar($event)"
    />
  </div>

  <select class="filtro-estados__boton" aria-label="Filtrar por rol" (change)="onRolFiltro($event)">
    <option value="">Rol: todos</option>
    <option value="asignada">Asignada a mí</option>
    <option value="creada">Creada por mí</option>
  </select>

  <button
    type="button"
    class="filtro-estados__boton"
    [class.filtro-estados__boton--activo]="estadosSeleccionados().size > 0"
    (click)="toggleFiltroEstados($event)"
  >
    <mat-icon inline>filter_list</mat-icon>
    {{ etiquetaFiltroEstados() }}
  </button>
</div>

@if (filtroEstadosAbierto()) {
  <div
    class="filtro-estados__panel"
    [style.top.px]="panelPos().top"
    [style.left.px]="panelPos().left"
    (click)="$event.stopPropagation()"
  >
    @for (op of opcionesEstado; track op.value) {
      <label class="filtro-estados__opcion">
        <input
          type="checkbox"
          [checked]="estadosSeleccionados().has(op.value)"
          (change)="toggleEstado(op.value)"
        />
        {{ op.label }}
      </label>
    }
    <button type="button" class="filtro-estados__limpiar" (click)="limpiarEstados()">
      Limpiar
    </button>
  </div>
}

@if (errorAdjunto()) {
  <div class="tareas-tabla-error">{{ errorAdjunto() }}</div>
}

<input #inputArchivo type="file" hidden (change)="onArchivoElegido($event)" />
<div #contenedor class="tareas-tabla-tabulator"></div>
