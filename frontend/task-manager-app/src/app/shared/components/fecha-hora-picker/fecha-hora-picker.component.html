<div class="fh">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="fh__fecha">
    <mat-label>{{ label }}</mat-label>
    <!-- readonly + click: se elige solo con el calendario, sin escribir. -->
    <input
      matInput
      readonly
      [matDatepicker]="picker"
      [min]="hoy"
      [value]="fecha"
      [disabled]="disabled"
      (dateChange)="onFecha($event.value)"
      (click)="!disabled && picker.open()"
    />
    @if (fecha && !disabled) {
      <button mat-icon-button matIconSuffix type="button" aria-label="Quitar fecha" (click)="limpiar(); $event.stopPropagation()">
        <mat-icon>close</mat-icon>
      </button>
    }
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
    @if (hint) {
      <mat-hint>{{ hint }}</mat-hint>
    }
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="fh__hora">
    <mat-label>Hora</mat-label>
    <mat-select [value]="hora" [disabled]="disabled || !fecha" (selectionChange)="onHora($event.value)">
      @for (h of horas; track h) {
        <mat-option [value]="h">{{ h }}</mat-option>
      }
    </mat-select>
      @if (hint) {
      <mat-hint></mat-hint>
    }
  </mat-form-field>
</div>

@if (enPasado) {
  <p class="fh__aviso" role="alert">
    <mat-icon inline>warning_amber</mat-icon>
    La fecha y hora elegidas ya pasaron: si continúas, la notificación se enviará de inmediato.
  </p>
}
