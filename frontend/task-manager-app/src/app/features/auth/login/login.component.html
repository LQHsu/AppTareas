<div class="login-page">
  <mat-card class="login-card">
    <div class="login-brand">
      <img src="img/LogoUAMEncabezado.png" alt="Universidad Autónoma Metropolitana - Unidad Xochimilco" class="login-logo" />
      <h1>Gestor de Tareas UAM</h1>
      <p class="login-subtitle">Inicia sesión con tu Cuenta Única de Servicios</p>
    </div>

    @if (checkingSession) {
      <div class="login-loading">
        <mat-spinner diameter="32"></mat-spinner>
        <p>Verificando tu sesión…</p>
      </div>
    } @else {
      <button mat-flat-button color="primary" class="login-button" (click)="onLogin()">
        <mat-icon>login</mat-icon>
        Iniciar sesión
      </button>
    }

    <p class="login-footer">Coordinación de Servicios de Cómputo</p>
  </mat-card>
</div>
