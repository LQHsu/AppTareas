<div class="bloqueada-page">
  <mat-card class="bloqueada-card">
    <mat-icon class="bloqueada-icon">block</mat-icon>
    <h1>Cuenta bloqueada</h1>
    <p>
      Tu cuenta ha sido bloqueada por un administrador y no puedes acceder
      al sistema. Si crees que esto es un error, contacta al equipo de
      soporte de tu área.
    </p>
    <button mat-flat-button color="primary" (click)="onLogout()">Cerrar sesión</button>
  </mat-card>
</div>
