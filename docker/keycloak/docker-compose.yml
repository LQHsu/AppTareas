name: apptareas-keycloak

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: apptareas-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak} -d ${POSTGRES_DB:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: apptareas-keycloak
    restart: unless-stopped
    # "start" (modo produccion real) en vez de "start-dev" desde el corte
    # a produccion (Fase 6) - ver docker/keycloak/README.md. Mas estricto
    # que start-dev: exige que KC_HOSTNAME/KC_PROXY_HEADERS esten bien, o
    # el arranque falla en vez de arrancar igual con warnings.
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      # Reemplaza a KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD (deprecados) desde
      # Keycloak 26. Solo se usan la primera vez que arranca (crean al admin
      # inicial); cambiarlos despues no hace nada, se administra desde la UI.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?falta KC_ADMIN_USER en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?falta KC_ADMIN_PASSWORD en .env}
      # URL publica real que el navegador usa - Keycloak la necesita para
      # armar todos los links/redirects que genera (login, logout,
      # metadata OIDC). Sirve bajo /auth-server (KC_HTTP_RELATIVE_PATH),
      # no en la raiz, para calzar con el mismo dominio/path que usaba el
      # Keycloak compartido (appcafeteria) - Apache hace ProxyPass
      # /auth-server -> este contenedor, sin reescribir la ruta.
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HTTP_RELATIVE_PATH: /auth-server
      # Apache ya termina el TLS (certificado wildcard *.xoc.uam.mx) y
      # reenvia por HTTP interno a este contenedor con headers
      # X-Forwarded-*. Sin esto, "start" en modo produccion exige HTTPS
      # el mismo (rechaza la conexion) en vez de confiar en el proxy.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      # Export del realm (Fase 2) - se importa solo al arrancar (--import-realm).
      - ./import:/opt/keycloak/data/import
      # SPI custom de LDAP+DB institucional (Fase 3). Vacio por ahora.
      - ./providers:/opt/keycloak/providers
      # Tema custom de login (Fase 7) - archivos sueltos, a diferencia
      # de providers/ NO necesita "kc.sh build": Keycloak los lee
      # directo de esta carpeta (confirmado en el README que trae la
      # propia imagen). En modo "start" (produccion) igual se cachean,
      # asi que un cambio aqui necesita "docker compose restart
      # keycloak" para verse - en start-dev ni eso haria falta.
      - ./themes:/opt/keycloak/themes
    ports:
      # Solo localhost: nunca se expone directo a internet, va detras de
      # Apache como reverse proxy (mismo patron ya planeado para Kestrel).
      - "127.0.0.1:8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  keycloak_db_data:
