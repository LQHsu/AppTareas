# Sobreescribe SOLO las llaves que cambian respecto a la traduccion
# base de Keycloak (theme/base/login/messages/messages_es.properties,
# ya bastante completa de fabrica: "Iniciar sesion", "Has olvidado tu
# contrasena", etc. se heredan tal cual via "parent=keycloak.v2" en
# theme.properties). El resto del formulario, mensajes de error,
# flujos de registro/OTP, etc. ya sale en espanol sin tocar nada mas.
#
# username/password: el SPI custom (cusxacdi-uamx, ver
# docker/keycloak/README.md) valida contra CUSXACDI con matricula +
# NIP de 5 digitos, no un "usuario"/"contrasena" generico - login.ftl
# ya usa ${msg("username")}/${msg("password")} para el label de cada
# campo, asi que basta con sobreescribir estas dos llaves, sin tocar
# ningun .ftl.
username=Número económico
password=NIP

# Mismo texto que ya usa CUSXACDI/AuthModel.php del lado de
# appcafeteria ("Número económico o NIP incorrectos") - consistencia
# con el resto de los sistemas institucionales que comparten ese login.
invalidUserMessage=Matrícula o NIP incorrectos.

# accountTemporarilyDisabledMessage: clave DISTINTA de invalidUserMessage
# - es la que usa el flujo de navegador real cuando el bloqueo de fuerza
# bruta (Fase de seguridad, ver README mas abajo) ya se disparo. No es
# una fuga de informacion nueva: Keycloak YA distingue esto de fabrica en
# el navegador sin ninguna personalizacion nuestra (confirmado
# inspeccionando theme/base/login/messages/messages_en.properties). Lo
# que SI sigue siendo generico a proposito es el endpoint de token
# directo (grant_type=password, usado por APIs) - ese es OAuth2 puro,
# no pasa por temas ni por esta llave.
accountTemporarilyDisabledMessage=Tu cuenta se bloqueó temporalmente por varios intentos fallidos. Espera unos minutos e inténtalo de nuevo.

loginAccountTitle=Inicia sesión en AppTareas
doLogIn=Acceder
