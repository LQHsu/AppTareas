# Tema de login custom de AppTareas - archivos sueltos (no un .jar en
# providers/), asi que NO requiere "kc.sh build": Keycloak los lee
# directo de esta carpeta. En modo "start" (produccion, ver
# docker-compose.yml) los temas SI se cachean, asi que un cambio aqui
# necesita "docker compose restart keycloak" para verse - en
# "start-dev" no haria falta ni eso.
#
# parent=keycloak.v2 hereda TODO el layout/CSS/templates del tema base
# real de esta version de Keycloak (confirmado inspeccionando el jar
# org.keycloak.keycloak-themes-26.0.8.jar, no asumido - keycloak.v2 es
# el tema por default desde Keycloak 22+, versiones viejas usaban solo
# "keycloak"). Solo se sobreescribe lo minimo: los mensajes (ver
# messages/messages_es.properties) y una hoja de estilo chica encima.
parent=keycloak.v2
import=common/keycloak

# Se listan las DOS hojas: la base (heredada del tema padre, resuelta
# por la cadena de fallback de resources/) primero, y la nuestra
# despues para que gane en el cascade sin necesitar !important en casi
# nada. Si aqui solo se pusiera "css/login.css", se perderia el fine-
# tuning que trae keycloak.v2 (grid del contenedor, color del header).
styles=css/styles.css css/login.css
scripts=js/login.js
